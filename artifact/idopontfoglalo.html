<title>Lelkészi Időpontfoglaló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
<style>
/* Elrendezés: keskeny, egyoszlopos foglalási folyamat; a lelkészi felület fülekkel, kártyák csak ott, ahol önálló tárgyat jelölnek. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --ink: #1d272c;
  --muted: #5d6b72;
  --line: #d9e0e3;
  --accent: #2c5d73;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf2;
  --ok-bg: #e5f2ea; --ok: #24603a;
  --err-bg: #f8e5e3; --err: #8f2d25;
  --warn-bg: #fbf1dc; --warn: #7a5410;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151b1e; --surface: #1e262a; --ink: #e6ecee; --muted: #9aa9b0; --line: #33414a;
    --accent: #84bdd4; --accent-ink: #0d1a20; --accent-soft: #233841;
    --ok-bg: #1f3428; --ok: #9fd6b0; --err-bg: #3d2422; --err: #f0aaa2; --warn-bg: #3a301b; --warn: #ecc77c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151b1e; --surface: #1e262a; --ink: #e6ecee; --muted: #9aa9b0; --line: #33414a;
  --accent: #84bdd4; --accent-ink: #0d1a20; --accent-soft: #233841;
  --ok-bg: #1f3428; --ok: #9fd6b0; --err-bg: #3d2422; --err: #f0aaa2; --warn-bg: #3a301b; --warn: #ecc77c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
a { color: var(--accent); }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
.brand .mark { color: var(--accent); }
nav.tabsTop { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabsTop button { background: none; border: 0; padding: 6px 10px; border-radius: 8px; font: inherit; color: var(--muted); cursor: pointer; }
nav.tabsTop button[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
main { padding-block: 22px 48px; }

.hero { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; max-width: 65ch; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .74rem; font-weight: 600; color: var(--accent); }
.section-title { margin: 26px 0 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.svc { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: inherit; cursor: pointer; border-left: 4px solid var(--c, var(--accent)); }
.svc:hover { border-color: var(--accent); border-left-color: var(--c, var(--accent)); }
.svc .meta, .meta { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); font-size: .85rem; border: 0; color: var(--ink); font-family: inherit; }
button.chip { cursor: pointer; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--err); border-color: currentColor; background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 10px; font-size: .86rem; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 500; font-size: .92rem; min-width: 0; }
input:not([type=checkbox]):not([type=radio]), select, textarea {
  width: 100%; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
input[type=color] { padding: 2px; height: 38px; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
label.check input { margin-top: 4px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

.notice { padding: 10px 14px; border-radius: 8px; font-size: .92rem; }
.notice.ok { background: var(--ok-bg); color: var(--ok); }
.notice.err { background: var(--err-bg); color: var(--err); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--accent-soft); color: var(--ink); }

.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; background: var(--surface); }
.pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pick small { display: block; color: var(--muted); font-size: .8rem; }

.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav strong { text-align: center; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dayhead { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.dayhead b { display: block; font-size: .82rem; text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayhead span { color: var(--muted); font-size: .8rem; }
.slot { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 6px 0; font: inherit; font-size: .9rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.slot:hover { background: var(--accent-soft); }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.none { text-align: center; color: var(--muted); }
@media (max-width: 720px) {
  .days { grid-template-columns: 1fr; }
  .day { flex-direction: row; flex-wrap: wrap; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .dayhead { width: 100%; text-align: left; border: 0; padding: 0; display: flex; gap: 8px; align-items: baseline; }
  .day.empty { display: none; }
  .slot { padding: 6px 12px; }
}

dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
.subtabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .92rem; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
tr:last-child td { border-bottom: 0; }
tr.off td { opacity: .55; }
td.num, .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.off { background: var(--err-bg); color: var(--err); }
.pill.cal { background: var(--accent-soft); color: var(--accent); }

.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.item > div:first-child { min-width: 0; flex: 1 1 260px; }
.share { display: flex; gap: 6px; }
.share input { font-size: .85rem; min-width: 0; flex: 1; }
.week-form { display: grid; gap: 8px; }
.week-form label { display: grid; grid-template-columns: 100px 1fr; gap: 8px; align-items: center; font-weight: 500; }
@media (max-width: 520px) { .week-form label { grid-template-columns: 1fr; gap: 2px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.empty-state { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
@media (prefers-reduced-motion: no-preference) { .slot, .btn, .svc { transition: background-color .12s, border-color .12s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true">✝</span><span id="orgName">Lelkészi időpontfoglaló</span></div>
    <nav class="tabsTop" id="topnav" aria-label="Fő menü"></nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="stack">
    <h1>Időpontfoglalás</h1>
    <p class="muted">A szolgáltatások és a lelkészek betöltése folyamatban…</p>
  </div>
</main>
<div id="toast" class="toast notice" hidden></div>

<script>
(() => {
  const L = luxon;
  const TZ = 'Europe/Budapest';
  const GC = 'Google Calendar';
  const KINDS = { gyulekezet: 'Gyülekezet', munkacsoport: 'Munkacsoport', egyeb: 'Egyéb csoport' };
  const WD = ['', 'Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap'];
  const DEFAULT_CONFIG = { orgName: 'Gyülekezet', intro: 'Foglaljon időpontot lelkészeinkhez beszélgetésre, lelkigondozásra vagy egyéb alkalomra.', minNoticeHours: 12, maxDaysAhead: 60, stepMin: 30, inviteClient: true, shareBase: '' };

  // ---------- állapot ----------
  const S = {
    db: null, user: null, me: { id: null, canEdit: false, canWrite: null },
    config: { ...DEFAULT_CONFIG }, services: [], pastors: [], groups: [], taken: [], allBookings: [], myDoc: null,
    loaded: { config: false, services: false, pastors: false, groups: false }, slowNote: false, noDb: false,
    route: { name: 'home', group: null },
    flow: null,          // { serviceId, pastor, weekStart, slot, form, error, busy }
    done: null,          // { uid, bid }
    admin: { tab: 'bookings', edit: null, filterPastor: 'all', past: false, cal: { list: null, loading: false, syncing: false, log: [] } },
    confirmKey: null,
  };

  const $app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rid = (p) => p + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const slugify = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
  const dt = (ms) => L.DateTime.fromMillis(ms, { zone: TZ }).setLocale('hu');
  const fmt = (ms, f = 'yyyy. LLL d. HH:mm') => dt(ms).toFormat(f);
  const range = (b) => `${fmt(b.start, 'yyyy. LLLL d. (cccc) HH:mm')}–${fmt(b.end, 'HH:mm')}`;
  const today = () => L.DateTime.now().setZone(TZ).toISODate();
  const cfg = () => ({ ...DEFAULT_CONFIG, ...S.config });
  const pastorById = (id) => S.pastors.find((p) => p.id === id);
  const serviceById = (id) => S.services.find((s) => s.id === id);
  const activePastors = () => S.pastors.filter((p) => p.active !== false);
  const myPastor = () => (S.me.id ? S.pastors.find((p) => p.userId === S.me.id) : null);
  const clean = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== ''));

  let toastTimer;
  function toast(text, type = 'ok') {
    const t = document.getElementById('toast');
    t.className = `toast notice ${type}`; t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
  }
  function dbErr(e) {
    if (e && e.code === 'invalid_argument') return 'Ehhez a művelethez nincs jogosultsága ezen az oldalon.';
    if (e && e.code === 'quota_exceeded') return 'Megtelt az adattár. Töröljön régi foglalásokat, majd próbálja újra.';
    return 'A mentés nem sikerült. Ellenőrizze a kapcsolatot, és próbálja újra.';
  }

  // ---------- útvonal (hash) ----------
  function readRoute() {
    const h = decodeURIComponent((location.hash || '').slice(1));
    if (h.startsWith('csoport-')) S.route = { name: 'home', group: h.slice(8) };
    else if (h === 'foglalasaim') S.route = { name: 'mine', group: null };
    else if (h === 'lelkeszi') S.route = { name: 'admin', group: null };
    else S.route = { name: 'home', group: null };
    S.flow = null; S.done = null;
  }
  function go(hash) { if (location.hash.slice(1) === hash) { readRoute(); render(); } else location.hash = hash; }
  window.addEventListener('hashchange', () => { readRoute(); render(); window.scrollTo(0, 0); });

  const currentGroup = () => S.route.group ? S.groups.find((g) => g.slug === S.route.group && g.active !== false) : null;
  function visiblePastors() {
    const g = currentGroup();
    const all = activePastors();
    return g ? all.filter((p) => (g.memberIds || []).includes(p.id)) : all;
  }
  function pastorsFor(svc) {
    const ids = new Set(svc.pastorIds || []);
    return visiblePastors().filter((p) => ids.has(p.id));
  }

  // ---------- időpont-számítás ----------
  function parseRanges(text) {
    const out = [];
    for (const part of String(text || '').split(/[,;\n]+/)) {
      const p = part.trim(); if (!p) continue;
      const m = p.match(/^(\d{1,2})(?::(\d{2}))?\s*[-–]\s*(\d{1,2})(?::(\d{2}))?$/);
      if (!m) throw new Error(`Érvénytelen időszak: „${p}” (helyes: 09:00-12:00)`);
      const s = `${m[1].padStart(2, '0')}:${m[2] || '00'}`, e = `${m[3].padStart(2, '0')}:${m[4] || '00'}`;
      if (s >= e || e > '24:00') throw new Error(`Érvénytelen időszak: „${p}”`);
      out.push([s, e]);
    }
    return out;
  }
  function busyFor(pid) {
    const p = pastorById(pid) || {};
    const list = S.taken.filter((t) => t.pastorId === pid).map((t) => [t.start, t.end]);
    for (const b of p.busy || []) list.push(b);
    return list;
  }
  function slotsFor(svc, pastorIds, fromISO, days) {
    const c = cfg();
    const earliest = Date.now() + (Number(c.minNoticeHours) || 0) * 3600e3;
    const lastDay = L.DateTime.now().setZone(TZ).plus({ days: Number(c.maxDaysAhead) || 60 }).toISODate();
    const step = Math.max(5, Number(c.stepMin) || svc.durationMin) * 60e3;
    const dur = (Number(svc.durationMin) || 60) * 60e3;
    const pad = (Number(svc.bufferMin) || 0) * 60e3;
    const out = [];
    for (let i = 0; i < days; i++) {
      const d = L.DateTime.fromISO(fromISO, { zone: TZ }).plus({ days: i }).setLocale('hu');
      const date = d.toISODate();
      const map = new Map();
      if (date <= lastDay) {
        for (const pid of pastorIds) {
          const p = pastorById(pid); if (!p) continue;
          if ((p.timeOff || []).some((t) => date >= t.from && date <= (t.to || t.from))) continue;
          const busy = busyFor(pid);
          for (const [ws, we] of (p.availability || {})[d.weekday] || []) {
            const a = L.DateTime.fromISO(`${date}T${ws}`, { zone: TZ }).toMillis();
            const z = L.DateTime.fromISO(`${date}T${we}`, { zone: TZ }).toMillis();
            for (let s = a; s + dur <= z; s += step) {
              if (s < earliest) continue;
              const e = s + dur;
              if (busy.some(([bs, be]) => s < be + pad && e + pad > bs)) continue;
              if (!map.has(s)) map.set(s, []);
              map.get(s).push(pid);
            }
          }
        }
      }
      out.push({ date, weekday: d.toFormat('cccc'), label: d.toFormat('LLL d.'), slots: [...map.entries()].sort((x, y) => x[0] - y[0]).map(([start, pastors]) => ({ start, end: start + dur, pastors })) });
    }
    return out;
  }

  // ---------- adatbetöltés ----------
  async function boot() {
    readRoute();
    render();
    const slowTimer = setTimeout(() => { S.slowNote = true; render(); }, 10000);
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    S.db = db; S.user = user;
    if (user) {
      const [id, canEdit, canWrite] = await Promise.all([user.id(), user.canEdit(), user.can('data.write')]);
      S.me = { id, canEdit, canWrite };
    }
    if (!db) { clearTimeout(slowTimer); S.noDb = true; render(); return; }
    const done = (k) => { S.loaded[k] = true; if (Object.values(S.loaded).every(Boolean)) { clearTimeout(slowTimer); S.slowNote = false; } render(); };
    const fail = () => { clearTimeout(slowTimer); S.slowNote = true; render(); };
    db.doc('config/main').onSnapshot((s) => { S.config = s.exists ? s.data() : {}; if (!s.metadata.fromCache) done('config'); else render(); }, fail);
    const coll = (name, key) => db.collection(name).onSnapshot((q) => {
      S[key] = q.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (key === 'services') S.services.sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(b.name, 'hu'));
      if (key === 'pastors' || key === 'groups') S[key].sort((a, b) => String(a.name).localeCompare(b.name, 'hu'));
      if (!q.metadata.fromCache && key in S.loaded) done(key); else render();
    }, fail);
    coll('services', 'services'); coll('pastors', 'pastors'); coll('groups', 'groups'); coll('taken', 'taken');
    if (S.me.canEdit) {
      db.collection('bookings').onSnapshot((q) => {
        const all = [];
        for (const d of q.docs) for (const [bid, b] of Object.entries(d.data().items || {})) all.push({ ...b, id: bid, uid: d.id });
        S.allBookings = all.sort((a, b) => a.start - b.start);
        render();
      }, () => {});
    }
    if (S.me.id) db.doc('bookings/' + S.me.id).onSnapshot((s) => { S.myDoc = s.exists ? s.data() : null; render(); }, () => {});
  }

  // ---------- foglalás ----------
  async function claimSlot(pid, start, end, ref) {
    const doc = S.db.collection('taken').doc(`${pid}_${start}`);
    const lease = await doc.acquire({ holder: S.me.id || rid('h'), ttlMs: 8000 });
    if (!lease.acquired) return false;
    const snap = await doc.get();
    if (snap.exists && snap.data().pastorId) return false;
    await doc.set({ pastorId: pid, start, end, ref });
    return true;
  }
  async function writeOwnBooking(uid, bid, booking) {
    const ref = S.db.doc('bookings/' + uid);
    const s = await ref.get();
    if (s.exists) await ref.update({ items: { [bid]: booking } });
    else await ref.set({ items: { [bid]: booking } });
  }
  async function submitBooking() {
    const f = S.flow; const svc = serviceById(f.serviceId);
    const v = f.form;
    const fail = (msg) => { f.error = msg; f.busy = false; render(); };
    if (!S.me.id) return fail('A foglaláshoz be kell jelentkeznie a claude.ai-ra.');
    if (!f.slot) return fail('Kérjük, válasszon időpontot.');
    if (!v.name.trim()) return fail('Kérjük, adja meg a nevét.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) return fail('Kérjük, adjon meg érvényes e-mail címet.');
    if (!v.consent) return fail('A foglaláshoz fogadja el az adatkezelési tájékoztatót.');
    f.busy = true; f.error = null; render();
    const start = f.slot.start, end = f.slot.end;
    const pad = (Number(svc.bufferMin) || 0) * 60e3;
    let cands = f.pastor === 'any' ? [...f.slot.pastors] : [f.pastor];
    const load = (pid) => S.taken.filter((t) => t.pastorId === pid && t.start > Date.now()).length;
    cands.sort((a, b) => load(a) - load(b));
    const bid = rid('b');
    let pid = null;
    try {
      for (const c of cands) {
        if (busyFor(c).some(([bs, be]) => start < be + pad && end + pad > bs)) continue;
        if (await claimSlot(c, start, end, `${S.me.id}/${bid}`)) { pid = c; break; }
      }
    } catch (e) { return fail(dbErr(e)); }
    if (!pid) return fail('Ez az időpont időközben betelt. Kérjük, válasszon másikat.');
    const booking = {
      serviceId: svc.id, pastorId: pid, start, end,
      clientName: v.name.trim().slice(0, 120), email: v.email.trim().slice(0, 200), phone: v.phone.trim().slice(0, 40), note: v.note.trim().slice(0, 2000),
      status: 'confirmed', createdAt: Date.now(), groupSlug: currentGroup()?.slug || '',
    };
    try {
      await writeOwnBooking(S.me.id, bid, booking);
    } catch (e) {
      await S.db.doc(`taken/${pid}_${start}`).delete().catch(() => {});
      return fail(dbErr(e));
    }
    S.done = { uid: S.me.id, bid, booking: { ...booking, id: bid } };
    S.flow = null; render(); window.scrollTo(0, 0);
  }
  async function cancelBooking(uid, bid, b) {
    try {
      await S.db.doc('bookings/' + uid).update({ items: { [bid]: { status: 'cancelled', cancelledAt: Date.now(), gcalDeletePending: Boolean(b.gcalEventId) } } });
      await S.db.doc(`taken/${b.pastorId}_${b.start}`).delete().catch(() => {});
      toast('A foglalást lemondtuk.', 'info');
      const mp = myPastor();
      if (b.gcalEventId && mp && mp.id === b.pastorId) syncGoogle({ quiet: true });
    } catch (e) { toast(dbErr(e), 'err'); }
  }

  // ---------- Google Naptár (a lelkész saját kapcsolatán keresztül) ----------
  async function gcal(tool, input) {
    const mcp = await claude.use('mcp');
    if (!mcp) throw { code: 'unavailable', message: 'A Google Naptár ezen a nézeten nem érhető el.' };
    const r = await mcp.callTool(GC, tool, input);
    return r.payload || {};
  }
  function gcalMsg(e) {
    const c = e && e.code;
    if (c === 'server_not_connected' || c === 'server_not_found') return 'Nincs Google Naptár-kapcsolat. Adja hozzá a claude.ai Beállítások → Connectors menüben, majd próbálja újra.';
    if (c === 'needs_reauth') return 'A Google Naptár-kapcsolat lejárt. Kapcsolja újra a claude.ai Beállítások → Connectors menüben.';
    if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'Az oldal nem kapott engedélyt a Google Naptár használatára. Engedélyezze, amikor a claude.ai rákérdez, vagy az oldal Engedélyek menüjében.';
    if (c === 'blocked_by_policy') return 'A szervezete házirendje tiltja ezt a Google Naptár-műveletet.';
    if (c === 'selection_required') return 'Több Google Naptár-kapcsolata van: válassza ki, melyiket használja az oldal.';
    if (c === 'server_unavailable') return 'A Google Naptár most nem válaszol. Próbálja újra egy perc múlva.';
    if (c === 'unavailable') return e.message;
    return 'A Google Naptár-művelet nem sikerült' + (e && e.message ? `: ${e.message}` : '.');
  }
  const localISO = (ms) => dt(ms).toFormat("yyyy-LL-dd'T'HH:mm:ss");
  async function loadCalendars() {
    const c = S.admin.cal; c.loading = true; c.error = null; render();
    try {
      const all = []; let token;
      do {
        const p = await gcal('list_calendars', clean({ pageSize: 250, pageToken: token }));
        all.push(...(p.calendars || []));
        token = p.nextPageToken;
      } while (token && all.length < 500);
      c.list = all.map((x) => ({ id: x.id, summary: x.summary || x.id }));
    } catch (e) { c.error = gcalMsg(e); }
    c.loading = false; render();
  }
  function mergeIntervals(list) {
    const s = list.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
    const out = [];
    for (const [a, b] of s) { const last = out[out.length - 1]; if (last && a <= last[1]) last[1] = Math.max(last[1], b); else out.push([a, b]); }
    return out;
  }
  async function syncGoogle({ quiet = false } = {}) {
    const p = myPastor(); if (!p) return;
    const c = S.admin.cal; if (c.syncing) return;
    c.syncing = true; c.error = null; c.log = []; render();
    const g = { busyCalendars: ['primary'], target: 'primary', allDayBusy: false, ...(p.gcal || {}) };
    const conf = cfg();
    const mine = S.allBookings.filter((b) => b.pastorId === p.id);
    const ourIds = new Set(S.allBookings.map((b) => b.gcalEventId).filter(Boolean));
    try {
      // 1. Foglalt időszakok beolvasása a kiválasztott naptárakból
      const from = Date.now(), to = L.DateTime.now().setZone(TZ).plus({ days: (Number(conf.maxDaysAhead) || 60) + 1 }).toMillis();
      const busy = [];
      for (const cal of g.busyCalendars) {
        let token, pages = 0;
        do {
          const res = await gcal('list_events', clean({ calendarId: cal === 'primary' ? undefined : cal, startTime: localISO(from), endTime: localISO(to), timeZone: TZ, pageSize: 250, pageToken: token, orderBy: 'startTime' }));
          for (const ev of res.events || []) {
            if (ev.status === 'cancelled' || ev.transparency === 'transparent' || ourIds.has(ev.id)) continue;
            if (ev.start && ev.start.dateTime) busy.push([Date.parse(ev.start.dateTime), Date.parse(ev.end.dateTime)]);
            else if (g.allDayBusy && ev.start && ev.start.date) busy.push([L.DateTime.fromISO(ev.start.date, { zone: TZ }).toMillis(), L.DateTime.fromISO(ev.end.date, { zone: TZ }).toMillis()]);
          }
          token = res.nextPageToken; pages++;
        } while (token && pages < 10);
      }
      const merged = mergeIntervals(busy);
      await S.db.doc('pastors/' + p.id).update({ busy: merged, busySyncedAt: Date.now() });
      c.log.push(`${merged.length} foglalt időszak beolvasva ${g.busyCalendars.length} naptárból.`);
      // 2. Új foglalások beírása, lemondottak törlése a célnaptárban
      let created = 0, removed = 0;
      for (const b of mine) {
        if (b.status === 'confirmed' && !b.gcalEventId && b.end > Date.now()) {
          const svc = serviceById(b.serviceId) || { name: 'Foglalás' };
          const invite = conf.inviteClient !== false;
          const res = await gcal('create_event', clean({
            calendarId: g.target === 'primary' ? undefined : g.target,
            summary: `${svc.name} – ${b.clientName}`,
            description: [`Szolgáltatás: ${svc.name}`, `Név: ${b.clientName}`, `E-mail: ${b.email}`, b.phone ? `Telefon: ${b.phone}` : '', b.note ? `\nMegjegyzés:\n${b.note}` : ''].filter(Boolean).join('\n'),
            location: svc.location || undefined,
            startTime: localISO(b.start), endTime: localISO(b.end), timeZone: TZ,
            attendees: invite ? [{ email: b.email, displayName: b.clientName }] : undefined,
            notificationLevel: invite ? 'ALL' : 'NONE',
          }));
          const evId = res.id || (res.event && res.event.id) || 'ismeretlen';
          await S.db.doc('bookings/' + b.uid).update({ items: { [b.id]: { gcalEventId: evId, gcalCalendarId: g.target } } });
          created++;
        } else if (b.status === 'cancelled' && b.gcalDeletePending && b.gcalEventId) {
          if (b.gcalEventId !== 'ismeretlen') {
            try {
              await gcal('delete_event', clean({ calendarId: b.gcalCalendarId === 'primary' ? undefined : b.gcalCalendarId, eventId: b.gcalEventId, notificationLevel: conf.inviteClient !== false ? 'ALL' : 'NONE' }));
            } catch (e) { if (e.code !== 'tool_error') throw e; }
          }
          await S.db.doc('bookings/' + b.uid).update({ items: { [b.id]: { gcalDeletePending: false } } });
          removed++;
        }
      }
      c.log.push(`${created} új foglalás került a naptárba, ${removed} lemondott foglalás törölve.`);
      if (!quiet) toast('Szinkronizálás kész.');
    } catch (e) {
      c.error = e && e.code && !['invalid_argument', 'quota_exceeded'].includes(e.code) ? gcalMsg(e) : dbErr(e);
      if (quiet) toast(c.error, 'err');
    }
    c.syncing = false; render();
  }

    let list = S.allBookings.filter((b) => (a.past ? b.end <= now : b.end > now));
    if (a.filterPastor !== 'all') list = list.filter((b) => b.pastorId === a.filterPastor);
    if (a.past) list = [...list].reverse();
    let h = `<div class="row between" style="margin-bottom:12px">
      <div class="row"><button class="btn sm ${a.past ? 'ghost' : 'primary'}" data-act="past" data-v="0">Közelgő</button><button class="btn sm ${a.past ? 'primary' : 'ghost'}" data-act="past" data-v="1">Korábbi</button></div>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px">Lelkész <select id="fp" data-act="filterPastor"><option value="all">Mindenki</option>${S.pastors.map((p) => `<option value="${esc(p.id)}" ${a.filterPastor === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>`;
    if (!list.length) return h + `<div class="empty-state">Nincs megjeleníthető foglalás.</div>`;
    h += `<div class="tablewrap"><table><thead><tr><th>Időpont</th><th>Szolgáltatás</th><th>Lelkész</th><th>Foglaló</th><th>Állapot</th><th></th></tr></thead><tbody>`;
    for (const b of list) {
      const k = `a-${b.uid}-${b.id}`;
      h += `<tr class="${b.status === 'cancelled' ? 'off' : ''}"><td class="num">${esc(fmt(b.start, 'LLL d. (ccc) HH:mm'))}–${esc(fmt(b.end, 'HH:mm'))}</td>
        <td>${esc((serviceById(b.serviceId) || {}).name || '–')}</td><td>${esc((pastorById(b.pastorId) || {}).name || '–')}</td>
        <td><b>${esc(b.clientName)}</b><br><span class="small">${esc(b.email)}${b.phone ? ' · ' + esc(b.phone) : ''}</span>${b.note ? `<div class="small muted" style="white-space:pre-wrap">${esc(b.note)}</div>` : ''}</td>
        <td>${b.status === 'confirmed' ? '<span class="pill ok">Visszaigazolt</span>' : '<span class="pill off">Lemondva</span>'}${b.gcalEventId && b.status === 'confirmed' ? '<br><span class="pill cal">Naptárban</span>' : ''}</td>
        <td>${b.status === 'confirmed' && b.start > now ? (S.confirmKey === k ? `<div class="row"><button class="btn danger sm" data-act="cancelAdmin" data-uid="${esc(b.uid)}" data-id="${esc(b.id)}">Igen</button><button class="btn sm" data-act="unconfirm">Mégse</button></div>` : `<button class="btn danger sm" data-act="confirm" data-key="${k}">Lemondás</button>`) : ''}</td></tr>`;
    }
    return h + `</tbody></table></div>`;
  }

  function adminGoogle() {
    const p = myPastor(); const c = S.admin.cal;
    if (!p) {
      return `<div class="stack"><div class="notice info">A Google naptár szinkronizálásához először jelölje meg, melyik lelkész Ön: a <b>Lelkészek</b> fülön kattintson a saját nevénél az „Ez vagyok én” gombra.</div>
      <p class="muted">Minden lelkész a saját claude.ai fiókjával és a saját Google Naptár-kapcsolatával szinkronizál, így mindenki a saját naptárát köti be.</p></div>`;
    }
    const g = { busyCalendars: ['primary'], target: 'primary', allDayBusy: false, ...(p.gcal || {}) };
    const pendingNew = S.allBookings.filter((b) => b.pastorId === p.id && b.status === 'confirmed' && !b.gcalEventId && b.end > Date.now()).length;
    const pendingDel = S.allBookings.filter((b) => b.pastorId === p.id && b.status === 'cancelled' && b.gcalDeletePending).length;
    const cals = [{ id: 'primary', summary: 'Elsődleges naptár' }, ...((c.list || []).filter((x) => x.id !== 'primary'))];
    for (const id of [...g.busyCalendars, g.target]) if (!cals.some((x) => x.id === id)) cals.push({ id, summary: id });
    let h = `<div class="stack">
      <div class="card stack"><div class="row between"><h2>${esc(p.name)} naptára</h2>${p.busySyncedAt ? `<span class="small muted">Utolsó szinkronizálás: ${esc(fmt(p.busySyncedAt))}</span>` : '<span class="small muted">Még nem volt szinkronizálás</span>'}</div>
      <p class="muted">A szinkronizálás beolvassa a kiválasztott naptárak foglalt időszakait (csak az időpontokat, a programok címét nem), így azokra nem lehet foglalni. Az új foglalásokat beírja a célnaptárba, a lemondottakat törli.</p>
      <div class="row"><button class="btn primary" data-act="sync" ${c.syncing ? 'disabled' : ''}>${c.syncing ? 'Szinkronizálás…' : 'Szinkronizálás most'}</button>
        <span class="small muted">${pendingNew} új foglalás vár beírásra, ${pendingDel} lemondás törlésre.</span></div>
      ${c.error ? `<div class="notice err">${esc(c.error)}</div>` : ''}${c.log.length ? `<div class="notice ok">${c.log.map(esc).join('<br>')}</div>` : ''}</div>
      <form class="card stack" data-form="gcal"><div class="row between"><h2>Naptárak</h2><button class="btn sm" type="button" data-act="loadCals" ${c.loading ? 'disabled' : ''}>${c.loading ? 'Betöltés…' : (c.list ? 'Lista frissítése' : 'Naptáraim betöltése')}</button></div>
      ${c.list ? '' : '<p class="muted small">Töltse be a naptárlistát, hogy több naptárat is kiválaszthasson (pl. gyülekezeti és személyes).</p>'}
      <div class="tablewrap"><table><thead><tr><th>Naptár</th><th>Foglaltság figyelése</th><th>Foglalások ide</th></tr></thead><tbody>
      ${cals.map((x, i) => `<tr><td>${esc(x.summary)}</td><td><input type="checkbox" name="busy" value="${esc(x.id)}" id="gb-${i}" ${g.busyCalendars.includes(x.id) ? 'checked' : ''} aria-label="Foglaltság figyelése: ${esc(x.summary)}"></td>
        <td><input type="radio" name="target" value="${esc(x.id)}" id="gt-${i}" ${g.target === x.id ? 'checked' : ''} aria-label="Célnaptár: ${esc(x.summary)}"></td></tr>`).join('')}

      <div><button class="btn primary" type="submit">Mentés</button></div></form></div>`;

  // ---------- mentések ----------
  async function save(path, data, okMsg) {
    try { await S.db.doc(path).set(data); toast(okMsg); return true; } catch (e) { toast(dbErr(e), 'err'); return false; }
  }
  async function onForm(form) {
    const kind = form.dataset.form; const fd = new FormData(form);
    const str = (k, n = 500) => String(fd.get(k) || '').trim().slice(0, n);
    if (kind === 'booking') return submitBooking();
    if (kind === 'settings') {
      const ok = await save('config/main', { ...S.config, orgName: str('orgName', 120) || 'Gyülekezet', intro: str('intro', 600), minNoticeHours: Math.max(0, Number(fd.get('minNoticeHours')) || 0), maxDaysAhead: Math.min(365, Math.max(1, Number(fd.get('maxDaysAhead')) || 60)), stepMin: Math.min(240, Math.max(5, Number(fd.get('stepMin')) || 30)), shareBase: str('shareBase', 300), inviteClient: fd.get('inviteClient') === 'on' }, 'Beállítások mentve.');
      return ok;
    }
    if (kind === 'gcal') {
      const p = myPastor(); if (!p) return;
      const busy = fd.getAll('busy').map(String);
      const target = String(fd.get('target') || 'primary');
      try { await S.db.doc('pastors/' + p.id).update({ gcal: { busyCalendars: busy, target, allDayBusy: fd.get('allDayBusy') === 'on' } }); toast('Naptárbeállítások mentve. A változás a következő szinkronizáláskor érvényesül.'); }
      catch (e) { toast(dbErr(e), 'err'); }
      return;
    }
    const id = form.dataset.id || rid(kind[0]);
    if (kind === 'pastor') {
      const old = pastorById(id) || {};
      const availability = {};
      try { for (let d = 1; d <= 7; d++) { const r = parseRanges(fd.get('d' + d)); if (r.length) availability[d] = r; } } catch (e) { toast(e.message, 'err'); return; }
      const timeOff = [...(old.timeOff || [])];
      const from = str('offFrom', 10);
      if (from) { const to = str('offTo', 10) || from; if (to < from) { toast('A távollét vége nem lehet korábbi a kezdeténél.', 'err'); return; } timeOff.push({ from, to, note: str('offNote', 120) }); }
      const data = { ...old, name: str('name', 120), title: str('title', 120), congregation: str('congregation', 120), bio: str('bio', 1000), active: fd.get('active') === 'on', availability, timeOff };
      delete data.id;
      if (!data.name) { toast('A név kötelező.', 'err'); return; }
      if (await save('pastors/' + id, data, 'Lelkész mentve.')) S.admin.edit = { kind, id };
      render(); return;
    }
    if (kind === 'service') {
      const old = serviceById(id) || {};
      const data = { ...old, name: str('name', 120), description: str('description', 600), durationMin: Math.min(600, Math.max(5, Number(fd.get('durationMin')) || 60)), bufferMin: Math.min(240, Math.max(0, Number(fd.get('bufferMin')) || 0)), location: str('location', 120), color: /^#[0-9a-f]{6}$/i.test(fd.get('color')) ? fd.get('color') : '#2c5d73', sort: Number(fd.get('sort')) || 0, active: fd.get('active') === 'on', pastorIds: fd.getAll('pastorIds').map(String) };
      delete data.id;
      if (!data.name) { toast('A név kötelező.', 'err'); return; }
      if (await save('services/' + id, data, 'Szolgáltatás mentve.')) S.admin.edit = null;
      render(); return;
    }
    if (kind === 'group') {
      const old = S.groups.find((g) => g.id === id) || {};
      let slug = slugify(fd.get('slug') || fd.get('name'));
      if (!slug) { toast('A név kötelező.', 'err'); return; }
      if (S.groups.some((g) => g.slug === slug && g.id !== id)) { toast('Ez a link-azonosító már foglalt, válasszon másikat.', 'err'); return; }
      const data = { ...old, name: str('name', 120), kind: KINDS[fd.get('kind')] ? String(fd.get('kind')) : 'egyeb', slug, description: str('description', 600), active: fd.get('active') === 'on', memberIds: fd.getAll('memberIds').map(String) };
      delete data.id;
      if (await save('groups/' + id, data, 'Csoport mentve.')) S.admin.edit = null;
      render();
    }
  }

  // ---------- eseménykezelés ----------
  document.addEventListener('submit', (e) => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); onForm(f); });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.bind && S.flow) { S.flow.form[el.dataset.bind] = el.type === 'checkbox' ? el.checked : el.value; if (el.type === 'checkbox') render(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.act === 'pastor') { S.flow.pastor = el.value; S.flow.slot = null; render(); }
    if (el.dataset.act === 'filterPastor') { S.admin.filterPastor = el.value; render(); }
  });
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
    const act = b.dataset.act; const id = b.dataset.id;
    switch (act) {
      case 'nav': go(b.dataset.hash || ''); break;
      case 'book': S.done = null; S.flow = { serviceId: id, pastor: b.dataset.pastor || 'any', weekStart: today(), slot: null, form: S.flow ? S.flow.form : { name: '', email: '', phone: '', note: '', consent: false }, error: null, busy: false }; render(); window.scrollTo(0, 0); break;
      case 'back': S.flow = null; S.done = null; render(); break;
      case 'week': { const n = L.DateTime.fromISO(S.flow.weekStart).plus({ days: Number(b.dataset.d) }).toISODate(); S.flow.weekStart = n < today() ? today() : n; render(); break; }
      case 'slot': {
        const svc = serviceById(S.flow.serviceId); const start = Number(b.dataset.start);
        const ids = S.flow.pastor === 'any' ? pastorsFor(svc).map((p) => p.id) : [S.flow.pastor];
        const day = slotsFor(svc, ids, L.DateTime.fromMillis(start, { zone: TZ }).toISODate(), 1)[0];
        S.flow.slot = day.slots.find((s) => s.start === start) || null; S.flow.error = null; render(); break;
      }
      case 'confirm': S.confirmKey = b.dataset.key; render(); break;
      case 'unconfirm': S.confirmKey = null; render(); break;
      case 'cancelMine': { const bk = S.myDoc.items[id]; S.confirmKey = null; await cancelBooking(S.me.id, id, bk); break; }
      case 'cancelAdmin': { const bk = S.allBookings.find((x) => x.id === id && x.uid === b.dataset.uid); S.confirmKey = null; await cancelBooking(b.dataset.uid, id, bk); break; }
      case 'tab': S.admin.tab = b.dataset.tab; S.admin.edit = null; S.confirmKey = null; render(); break;
      case 'past': S.admin.past = b.dataset.v === '1'; render(); break;
      case 'edit': S.admin.edit = { kind: b.dataset.kind, id: id || '' }; S.confirmKey = null; render(); window.scrollTo(0, 0); break;
      case 'closeEdit': S.admin.edit = null; S.confirmKey = null; render(); break;
      case 'del': {
        const path = { pastor: 'pastors/', service: 'services/', group: 'groups/' }[b.dataset.kind] + id;
        try { await S.db.doc(path).delete(); toast('Törölve.', 'info'); S.admin.edit = null; S.confirmKey = null; render(); } catch (err) { toast(dbErr(err), 'err'); }
        break;
      }
      case 'rmOff': {
        const p = pastorById(S.admin.edit.id); if (!p) break;
        const timeOff = (p.timeOff || []).filter((_, i) => i !== Number(b.dataset.i));
        try { await S.db.doc('pastors/' + p.id).update({ timeOff }); } catch (err) { toast(dbErr(err), 'err'); }
        break;
      }
      case 'claim': try { await S.db.doc('pastors/' + id).update({ userId: S.me.id }); toast('Rendben, ez a lelkészi profil Önhöz tartozik. Most bekötheti a Google naptárát.'); } catch (err) { toast(dbErr(err), 'err'); } break;
      case 'unclaim': try { await S.db.doc('pastors/' + id).update({ userId: null }); toast('Leválasztva.', 'info'); } catch (err) { toast(dbErr(err), 'err'); } break;
      case 'loadCals': loadCalendars(); break;
      case 'sync': syncGoogle(); break;
      case 'fromCongr': {
        const name = b.dataset.name; const gid = rid('g');
        let slug = slugify(name); let n = 2; while (S.groups.some((g) => g.slug === slug)) slug = `${slugify(name)}-${n++}`;
        await save('groups/' + gid, { name, slug, kind: 'gyulekezet', description: '', active: true, memberIds: activePastors().filter((p) => p.congregation === name).map((p) => p.id) }, `„${name}” csoport létrehozva.`);
        break;
      }
      case 'copy': {
        const input = document.getElementById(b.dataset.target);
        try { await navigator.clipboard.writeText(input.value); b.textContent = 'Másolva ✓'; } catch (_) { input.select(); b.textContent = 'Kijelölve – másolja ki'; }
        setTimeout(() => { b.textContent = 'Másolás'; }, 1800);
        break;
      }
    }
  });

  boot();
})();
</script>
